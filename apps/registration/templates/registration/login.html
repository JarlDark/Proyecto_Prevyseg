{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Otec Prevyseg</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'core/css/style.css' %}">
</head>
<body class="login-body">

    <div class="login-container">
        <div class="text-center mb-4">
            <img src="{% static 'core/images/logo.png' %}" alt="Logo Prevyseg" style="width: 120px;">
        </div>

        <div class="card login-card shadow-sm">
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}

                    {% if form.non_field_errors %}
                        <div class="alert alert-danger" role="alert">
                            {% for error in form.non_field_errors %}
                                {{ error }}
                            {% endfor %}
                        </div>
                    {% endif %}

                    <div class="mb-3">
                        <label for="id_username" class="form-label">Correo</label>
                        <input type="text" name="username" class="form-control" id="id_username" placeholder="Ingresa tu correo electrónico" required>
                    </div>

                    <div class="mb-3">
                        <label for="id_password" class="form-label">Contraseña</label>
                        <input type="password" name="password" class="form-control" id="id_password" placeholder="Ingresa tu contraseña" required>
                    </div>
                    
                    <div class="text-end mb-3">
                        <a href="#" class="form-text">¿Olvidaste tu contraseña?</a>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn login-btn-primary">Iniciar Sesión</button>
                        <a href="#" class="btn login-btn-secondary">Registrarse</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

</body>
</html>
