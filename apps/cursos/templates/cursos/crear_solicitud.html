{% extends 'core/base.html' %}

{% block title %}Solicitar Inscripción{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <h2 class="text-center mb-4">Formulario de Interés</h2>
        <p class="text-center">Completá tus datos y nos pondremos en contacto para finalizar tu inscripción.</p>
        <div class="card shadow-sm">
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-primary">Enviar Solicitud</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
